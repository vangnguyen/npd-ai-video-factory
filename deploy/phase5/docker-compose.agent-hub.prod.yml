name: npd-agent-hub-prod

services:
  agent-hub:
    image: ${AGENT_HUB_IMAGE:-npd-agent-hub:phase5}
    build:
      context: ../..
      dockerfile: services/agent_hub/Dockerfile
    restart: unless-stopped
    env_file:
      - ${AGENT_HUB_ENV_FILE:-/etc/npd-ai/agent-hub.env}
    environment:
      VIDEO_API_URL: ${VIDEO_API_URL:-http://api:8000}
      AGENT_STORE_BACKEND: redis
      AGENT_REDIS_URL: ${AGENT_REDIS_URL:-redis://redis:6379/1}
      AGENT_STORE_NAMESPACE: ${AGENT_STORE_NAMESPACE:-npd:agent-hub:v1}
      AGENT_AUTH_MODE: static_token
    ports:
      - "127.0.0.1:${AGENT_HUB_PORT:-8010}:8010"
    volumes:
      - ${GA4_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:/run/secrets/ga4-service-account.json:ro
    networks:
      video-factory-existing: {}
      n8n-existing:
        aliases:
          - npd-agent-hub
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=5).read()"
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  video-factory-existing:
    external: true
    name: ${NPD_DOCKER_NETWORK:-npd-ai-video-factory_default}
  n8n-existing:
    external: true
    name: ${N8N_DOCKER_NETWORK:-n8n-marketing_n8n_net}
