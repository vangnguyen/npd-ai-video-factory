[project]
name = "npd-video-worker"
version = "0.1.0"
description = "Pipeline worker for NPD AI Video Factory"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["npd_worker*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
