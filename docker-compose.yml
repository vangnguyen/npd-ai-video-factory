name: npd-ai-video-factory

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:3001
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    depends_on:
      redis:
        condition: service_healthy

  agent-hub:
    build:
      context: .
      dockerfile: services/agent_hub/Dockerfile
    env_file: .env
    environment:
      VIDEO_API_URL: http://api:8000
      AGENT_STORE_BACKEND: redis
      AGENT_REDIS_URL: redis://redis:6379/1
      AGENT_STORE_NAMESPACE: npd:agent-hub:v1
    ports:
      - "8010:8010"
    volumes:
      - ${GA4_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:/run/secrets/ga4-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:3001
      VIDEO_MANIFEST_SCHEMA_PATH: /workspace/packages/contracts/video-manifest.schema.json
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    depends_on:
      redis:
        condition: service_healthy
      renderer:
        condition: service_started

  renderer:
    build:
      context: ./renderer
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    shm_size: "2gb"

volumes:
  redis-data:
