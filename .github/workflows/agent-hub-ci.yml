name: Agent Hub CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main
    paths:
      - "services/agent_hub/**"
      - "scripts/ci/**"
      - "scripts/ops/v1_backup/**"
      - "scripts/ops/agent_hub_redis/**"
      - "scripts/ops/v1_publication_audit/**"
      - "workflows/n8n/**"
      - "docs/video-factory-v1-decommission/**"
      - ".github/workflows/agent-hub-ci.yml"
      - "docker-compose.yml"

jobs:
  validate-n8n-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V1 decommission inventory
        run: python scripts/ci/validate-v1-decommission-inventory.py
      - name: Validate V1/AH-01C audit tooling syntax
        run: |
          python -m py_compile scripts/ops/v1_backup/verify_redis_export.py
          python -m py_compile scripts/ops/agent_hub_redis/run_synthetic_restore_drill.py
          python -m py_compile scripts/ops/v1_publication_audit/audit_wordpress_public.py
          bash -n scripts/ops/v1_backup/export-db0-readonly.sh
      - name: Validate import with production n8n version
        run: bash scripts/ci/validate-n8n-workflows.sh

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run Agent Hub, Campaign OS and Attribution OS tests
        run: pytest -q
      - name: Run Phase 5.1 business-answer eval gate
        run: python -m npd_agent_hub.evals --minimum-pass-rate 1.0
      - name: Validate AH-R01 Redis independence candidate
        run: |
          python ../../scripts/ops/agent_hub_redis/validate_independence_candidate.py
          python -m py_compile npd_agent_hub/redis_connection.py npd_agent_hub/redis_read_model_probe.py npd_agent_hub/redis_source_snapshot.py
          python -m py_compile ../../scripts/ops/agent_hub_redis/run_independence_candidate_drill.py
          bash -n ../../scripts/ops/agent_hub_redis/ah_r01_preflight.sh
          bash -n ../../scripts/ops/agent_hub_redis/ah_r01_provision.sh
          bash -n ../../scripts/ops/agent_hub_redis/ah_r01_export_encrypted.sh
          python ../../scripts/ops/agent_hub_redis/run_independence_candidate_drill.py
