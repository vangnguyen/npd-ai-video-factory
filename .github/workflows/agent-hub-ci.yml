name: Agent Hub CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run Agent Hub, Campaign OS and Attribution OS tests
        run: pytest -q
      - name: Run Phase 5.1 business-answer eval gate
        run: python -m npd_agent_hub.evals --minimum-pass-rate 1.0
