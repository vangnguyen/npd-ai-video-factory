name: Agent Hub CI

on:
  pull_request:
    paths:
      - "services/agent_hub/**"
      - "deploy/phase5/**"
      - "scripts/phase5/**"
      - ".github/workflows/agent-hub-ci.yml"
      - "docker-compose.yml"
  push:
    branches:
      - main
    paths:
      - "services/agent_hub/**"
      - ".github/workflows/agent-hub-ci.yml"
      - "docker-compose.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
