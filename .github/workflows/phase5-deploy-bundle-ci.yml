name: Phase 5 Deployment Bundle CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/phase5/*.sh

      - name: Validate PowerShell remote helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/phase5/remote-deploy.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Create non-secret CI env fixture
        run: |
          cat > /tmp/npd-agent-hub-ci.env <<'EOF'
          VIDEO_API_URL=http://api:8000
          AGENT_TOOL_TIMEOUT_SECONDS=30
          AGENT_STORE_BACKEND=redis
          AGENT_REDIS_URL=redis://redis:6379/1
          AGENT_STORE_NAMESPACE=npd:agent-hub:v1
          AGENT_AUTH_MODE=static_token
          AGENT_VIEWER_TOKEN=viewer-ci-token-00000000000000000000000000000000
          AGENT_OPERATOR_TOKEN=operator-ci-token-000000000000000000000000000000
          AGENT_OWNER_TOKEN=owner-ci-token-000000000000000000000000000000000
          AGENT_BROWSER_AUTH_MODE=google_oidc
          AGENT_PUBLIC_BASE_URL=https://mkt.example.invalid
          AGENT_GOOGLE_CLIENT_ID=ci-client.apps.googleusercontent.com
          AGENT_GOOGLE_CLIENT_SECRET=ci-client-secret-placeholder
          AGENT_SESSION_SIGNING_KEY=ci-session-key-00000000000000000000000000000000
          AGENT_ATTRIBUTION_ACTIVE_SIGNING_KEY=ci-attribution-receipt-key-0000000000000000000000
          AGENT_ATTRIBUTION_ACTIVE_KEY_ID=ci-attribution-v1
          AGENT_ATTRIBUTION_VERIFICATION_KEYS_HOST_FILE=/tmp/npd-attribution-verification-keys.json
          AGENT_ATTRIBUTION_VERIFICATION_KEYS_FILE=/run/secrets/agent-attribution-verification-keys.json
          AGENT_ATTRIBUTION_RECEIPT_SIGNING_KEY=ci-attribution-receipt-key-0000000000000000000000
          AGENT_ATTRIBUTION_RECEIPT_KEY_ID=ci-attribution-v1
          AGENT_ATTRIBUTION_DELIVERY_MAX_ATTEMPTS=4
          AGENT_ATTRIBUTION_FRESHNESS_SLOS_JSON='{"n8n_lead_intake":15,"meta_ads":1440,"ga4":1440,"espocrm":1440,"utm":60}'
          AGENT_SESSION_TTL_SECONDS=28800
          AGENT_OWNER_EMAILS=owner@example.invalid
          AGENT_OPERATOR_EMAILS=
          AGENT_VIEWER_EMAILS=
          ESPOCRM_URL=https://crm.example.invalid
          ESPOCRM_API_KEY=ci-read-only-placeholder
          N8N_AGENT_EXECUTOR_WEBHOOK_URL=
          EOF
          chmod 600 /tmp/npd-agent-hub-ci.env
          printf '{}\n' > /tmp/npd-attribution-verification-keys.json
          chmod 600 /tmp/npd-attribution-verification-keys.json

      - name: Validate production Compose rendering
        env:
          AGENT_HUB_ENV_FILE: /tmp/npd-agent-hub-ci.env
          NPD_DOCKER_NETWORK: npd-ai-video-factory_default
          N8N_DOCKER_NETWORK: n8n-marketing_n8n_net
          AGENT_HUB_PORT: "8010"
          AGENT_ATTRIBUTION_VERIFICATION_KEYS_HOST_FILE: /tmp/npd-attribution-verification-keys.json
        run: docker compose -f deploy/phase5/docker-compose.agent-hub.prod.yml config --quiet

      - name: Validate guarded attribution delivery configuration
        run: |
          cp /tmp/npd-agent-hub-ci.env /tmp/npd-agent-hub-config-test.env
          sed -i '/^AGENT_ATTRIBUTION_/d' /tmp/npd-agent-hub-config-test.env
          printf '%s\n' \
            'AGENT_ATTRIBUTION_VERIFICATION_KEYS_HOST_FILE=/tmp/npd-attribution-config-test-keys.json' \
            'AGENT_ATTRIBUTION_VERIFICATION_KEYS_FILE=/run/secrets/agent-attribution-verification-keys.json' \
            >> /tmp/npd-agent-hub-config-test.env
          before_session="$(grep '^AGENT_SESSION_SIGNING_KEY=' /tmp/npd-agent-hub-config-test.env)"
          output="$(bash scripts/phase5/configure-attribution-delivery.sh \
            --apply \
            --env-file /tmp/npd-agent-hub-config-test.env \
            --backup-dir /tmp/npd-agent-hub-config-backups)"
          grep -q '^AGENT_ATTRIBUTION_ACTIVE_SIGNING_KEY=.' /tmp/npd-agent-hub-config-test.env
          grep -q '^AGENT_ATTRIBUTION_ACTIVE_KEY_ID=npd-attribution-v1$' /tmp/npd-agent-hub-config-test.env
          grep -q '^AGENT_ATTRIBUTION_RECEIPT_KEY_ID=npd-attribution-v1$' /tmp/npd-agent-hub-config-test.env
          test "$(grep '^AGENT_SESSION_SIGNING_KEY=' /tmp/npd-agent-hub-config-test.env)" = "$before_session"
          test "$(find /tmp/npd-agent-hub-config-backups -type f | wc -l)" -eq 1
          first_key="$(grep '^AGENT_ATTRIBUTION_ACTIVE_SIGNING_KEY=' /tmp/npd-agent-hub-config-test.env | cut -d= -f2-)"
          ! grep -q "$first_key" <<<"$output"
          rotate_output="$(bash scripts/phase5/configure-attribution-delivery.sh \
            --apply \
            --rotate \
            --new-key-id ci-attribution-v2 \
            --env-file /tmp/npd-agent-hub-config-test.env \
            --backup-dir /tmp/npd-agent-hub-config-backups)"
          grep -q '^AGENT_ATTRIBUTION_ACTIVE_KEY_ID=ci-attribution-v2$' /tmp/npd-agent-hub-config-test.env
          python3 - <<'PY'
          import json
          with open('/tmp/npd-attribution-config-test-keys.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert set(payload) == {'npd-attribution-v1'}
          assert len(payload['npd-attribution-v1']) >= 32
          PY
          ! grep -q "$first_key" <<<"$rotate_output"

      - name: Validate Caddy site-block syntax in the production image
        run: >-
          docker run --rm
          -v "$PWD/deploy/phase5/Caddyfile.agent-hub.example:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build production Agent Hub image
        run: docker build -f services/agent_hub/Dockerfile -t npd-agent-hub:phase5-ci .

      - name: Save deployable Phase 9 delivery Docker archive
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/agent-hub-phase9-delivery.docker.tar"
          docker save --output "$archive" npd-agent-hub:phase5-ci
          sha256sum "$archive" > "${archive}.sha256"
          export IMAGE_CONFIG_DIGEST="$(docker image inspect --format '{{.Id}}' npd-agent-hub:phase5-ci)"
          python - <<'PY'
          import hashlib, json, os, pathlib
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-hub-phase9-delivery.docker.tar"
          receipt = {
              "schema": "npd.agent-hub.phase9.delivery-docker-build.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "platform": "linux/amd64",
              "image_config_digest": os.environ["IMAGE_CONFIG_DIGEST"],
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "production_build": False,
              "production_push": False,
          }
          output = archive.with_name("DOCKER_BUILD_RECEIPT.json")
          output.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Configure immutable OCI builder
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build immutable linux/amd64 Phase 9 delivery OCI archive
        if: github.event_name == 'workflow_dispatch'
        id: phase9_oci
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent_hub/Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/agent-hub-phase9-delivery.oci.tar
          provenance: mode=max
          sbom: true

      - name: Record Phase 9 OCI archive and source provenance
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_MANIFEST_DIGEST: ${{ steps.phase9_oci.outputs.digest }}
          BUILD_METADATA: ${{ steps.phase9_oci.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          sha256sum agent-hub-phase9-delivery.oci.tar > agent-hub-phase9-delivery.oci.tar.sha256
          python - <<'PY'
          import hashlib, json, os, pathlib
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-hub-phase9-delivery.oci.tar"
          metadata = json.loads(os.environ["BUILD_METADATA"])
          receipt = {
              "schema": "npd.agent-hub.phase9.delivery-oci-build.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "platform": "linux/amd64",
              "image_manifest_digest": os.environ["IMAGE_MANIFEST_DIGEST"],
              "image_config_digest": metadata.get("containerimage.config.digest"),
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "production_build": False,
              "production_push": False,
          }
          output = archive.with_name("BUILD_RECEIPT.json")
          output.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable Phase 9 delivery candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-phase9-delivery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-hub-phase9-delivery.docker.tar
            ${{ runner.temp }}/agent-hub-phase9-delivery.docker.tar.sha256
            ${{ runner.temp }}/DOCKER_BUILD_RECEIPT.json
            ${{ runner.temp }}/agent-hub-phase9-delivery.oci.tar
            ${{ runner.temp }}/agent-hub-phase9-delivery.oci.tar.sha256
            ${{ runner.temp }}/BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate maintenance module and tests
        working-directory: services/agent_hub
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m py_compile npd_agent_hub/maintenance.py
          pytest -q tests/test_maintenance.py
